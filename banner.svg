<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-label="Transformo ideias em soluções">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a0016"/>
      <stop offset="0.55" stop-color="#2a0a24"/>
      <stop offset="1" stop-color="#4a2040"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.3" r="0.55">
      <stop offset="0" stop-color="#c9779a" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#c9779a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="nome" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d9a0b4"/>
    </linearGradient>
    <pattern id="pixels" width="24" height="24" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="2" height="2" fill="#d9a0b4" opacity="0.14"/>
    </pattern>
    <style>
      .mono { font-family: ui-monospace, "JetBrains Mono", Menlo, Consolas, monospace; }
      .sans { font-family: "Open Sans", "Noto Sans", "Segoe UI", Helvetica, Arial, sans-serif; }
      .flutua { animation: flutuar 6s ease-in-out infinite; }
      .flutua2 { animation: flutuar 7.5s ease-in-out infinite reverse; }
      @keyframes flutuar { 50% { transform: translateY(-10px); } }
    </style>
  </defs>

  <rect width="1280" height="320" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="320" rx="24" fill="url(#pixels)"/>
  <rect width="1280" height="320" rx="24" fill="url(#glow)"/>

  <!-- blocos em pixel, à direita -->
  <g class="flutua">
    <rect x="1010" y="70" width="44" height="44" rx="8" fill="#a8456a"/>
    <rect x="1062" y="70" width="44" height="44" rx="8" fill="#c9779a"/>
    <rect x="1062" y="122" width="44" height="44" rx="8" fill="#a8456a" opacity="0.8"/>
    <rect x="1114" y="122" width="44" height="44" rx="8" fill="#d9a0b4"/>
  </g>
  <g class="flutua2">
    <rect x="1010" y="174" width="44" height="44" rx="8" fill="#d9a0b4" opacity="0.55"/>
    <rect x="1114" y="174" width="44" height="44" rx="8" fill="#a8456a" opacity="0.6"/>
    <rect x="1166" y="226" width="44" height="44" rx="8" fill="#c9779a" opacity="0.5"/>
  </g>

  <text x="72" y="178" class="sans" font-size="56" font-weight="800" fill="url(#nome)">Transformo ideias em soluções.</text>
</svg>
